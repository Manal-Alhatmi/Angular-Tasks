<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<form>
    <div class="pageTitle">
    <p>With Free Source Code</p> 
    <h1>TO DO LIST</h1> 
    <p id="a">HTML, CSS, JavaScript</p>
    </div>

    <input type="text" class="ReviewPresentation" name="ReviewPresentation" placeholder="Review Presentation">
    <button type="submit">Add</button>

    <p id="r">  You have 3 task(s) to complete</p>

    <label>
        <input type="checkbox" class="task1" name="task">
        <span>Edit Video</span>
        <button type="button">Edit</button>
        <button type="button">Delete</button>
    </label>

    <label>
        <input type="checkbox" class="task2" name="task" checked>
        <span>Buy Eggs & Milk</span>
        <button type="button">Edit</button>
        <button type="button">Delete</button>
    </label>

    <label>
        <input type="checkbox" class="task3" name="task">
        <span>Organize Files</span>
        <button type="button">Edit</button>
        <button type="button">Delete</button>
    </label>

    <label>
        <input type="checkbox" class="task4" name="task">
        <span>Write Blog Post</span>
        <button type="button">Edit</button>
        <button type="button">Delete</button>
    </label>
</form>
</body>

</html>
