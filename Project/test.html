<!DOCTYPE html>
<html>
    
<head>
    <title>Registration Form</title>
</head>

<body>

<h2>Registration</h2>

<form id="registrationForm">
    <label for="fname">First Name:</label>
    <input type="text" name="fname" id="fname" placeholder="Enter your First Name" >
    <br>
    <br>

    <label for="Lname">Last Name:</label>
    <input type="text" name="Lname" id="Lname" placeholder="Enter your Last Name" >
    <br>
    <br>

    <label for="email">Email:</label>
    <input type="email" name="email" id="email" placeholder="Enter your email">
    <br>
    <br>

    <label for="password">Password:</label>
    <input type="password" name="password" id="password" placeholder="Enter password">
    <br>
    <br>

    <label>Gender:</label>
    <br>
    <input type="radio"  id="male" name="gender" value="male"> <label for="male">Male</label>
    <br>
    <input type="radio" id="female" name="gender" value="female"> <label for="female">Female</label>
    <br>
    <br>
    
    <label for="age">Age:</label>
    <input type="number" name="age" id="age" min="20">
    <br>
    <br>


    <label for="dob">Date of Birth:</label>
    <input type="date" name="dob" id="dob">
    <br>
    <br>

    <label>Skills:</label>
    <br>
    <input type="checkbox" id="html" name="skills" value="HTML"> <label for="html">HTML</label>
    <br>
    <input type="checkbox" id="css" name="skills" value="CSS"> <label for="css">CSS</label>
    <br>
    <input type="checkbox" id="javascript" name="skills" value="JavaScript"> <label for="javascript">JavaScript</label>
    <br>
    <input type="checkbox" id="python" name="skills" value="Python"> <label for="python">Python</label>
    <br>
    <br>


    <label for="cv">Upload CV:</label>
    <br>
    <input type="file" name="cv" id="cv" accept=".pdf">
    <br>
    <br>

    <button type="submit" id="register">Register</button>
</form>

</body>
</html>
